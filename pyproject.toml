[project]
name = "plumbline"
version = "0.1.0"
description = "Toy compliance AI platform: shared building blocks, two workflows, and a model benchmark."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plumbline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
